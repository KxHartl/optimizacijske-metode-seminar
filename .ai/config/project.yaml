name: "OMuRiUS-seminar"
type: "seminar"              # seminar | thesis | paper | homework
latex_format: "fsb-seminar"  # fsb-seminar | fsb-thesis | fsb-paper
brain_mode: "global"         # none | global
# RAG is always available via AgentBrain (~/.agentbrain). Embeddings use Gemini
# if GEMINI_API_KEY is set in .env, otherwise local sentence-transformers.

# --- Metadata za naslovnicu (latex_architect popunjava main.tex) ---
author_name: "Krešimir Hartl"              # Ime i prezime studenta
course_name: "OPTIMIZACIJSKE METODE U RAZVOJU I UPRAVLJANJU SUSTAVA" # Naziv kolegija (UPPERCASE u dokumentu)
seminar_title: "Optimizacijske metode u razvoju i upravljanju sustava" # Puni naslov seminara
seminar_title_short: "OMuRiUS — Seminarski rad" # Skraćeni naslov za header (max ~50 znakova)
professor_title: "Prof. dr. sc."          # Titula (npr. "Prof. dr. sc.")
professor_name: "Andrej Jokić"           # Ime i prezime profesora

# --- Build & page limit ---
max_pages: 0                 # 0 = nema gornjeg ni donjeg ograničenja broja stranica
dist_version: "v1.7"         # build piše PDF u dist/<dist_version>/ (npr. "v1.0" za predaju)

# --- Opcijski popisi (latex_architect uključuje ako je true) ---
include_lof: false           # \listoffigures
include_lot: false           # \listoftables

# AgentBrain version used during bootstrap
agentbrain_version: "2.2.0"
agentbrain_commit: "46bb79d"
